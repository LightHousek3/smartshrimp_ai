services:
  ai:
    build: .
    environment:
      API_KEY: ${API_KEY:?Set a random API_KEY in .env}
      MODEL_DIR: /service/models/${MODEL_VERSION:-shrimpdx-cls-v1.0.0}
      DEVICE: cpu
      BLUR_THRESHOLD: ${BLUR_THRESHOLD:-50.0}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-20000000}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-2}
      ALLOW_SYNTHETIC_MODEL: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/service/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
