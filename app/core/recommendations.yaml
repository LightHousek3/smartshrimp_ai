Healthy: "Chưa ghi nhận dấu hiệu thuộc các nhóm bệnh được mô hình nhận diện. Tiếp tục theo dõi sức khỏe tôm và chất lượng nước; liên hệ chuyên gia nếu có dấu hiệu bất thường. Đây là gợi ý tham khảo, không thay thế chẩn đoán chuyên môn."
BG: "Nghi ngờ đen mang: ghi nhận hình ảnh mang và các chỉ số chất lượng nước, gửi thông tin cho chuyên gia thủy sản để đánh giá nguyên nhân và hướng dẫn xử lý. Đây là gợi ý tham khảo, không thay thế chẩn đoán chuyên môn."
WSSV: "Nghi ngờ đốm trắng: hạn chế di chuyển tôm và dụng cụ giữa các ao, liên hệ chuyên gia để được hướng dẫn thu mẫu xét nghiệm PCR và đánh giá biện pháp cách ly phù hợp. Đây là gợi ý tham khảo, không thay thế chẩn đoán chuyên môn."
WSSV_BG: "Nghi ngờ đồng thời dấu hiệu đen mang và đốm trắng: ghi nhận tình trạng tôm, hạn chế di chuyển giữa các ao và liên hệ chuyên gia để kiểm tra mang, hướng dẫn xét nghiệm PCR và đánh giá biện pháp xử lý. Đây là gợi ý tham khảo, không thay thế chẩn đoán chuyên môn."
