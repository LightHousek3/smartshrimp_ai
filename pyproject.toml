[project]
name = "smartshrimp-ai"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
description = "Stateless four-class shrimp image classification service"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
