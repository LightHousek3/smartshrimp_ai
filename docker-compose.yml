name: smartshrimp-ai

services:
  classification:
    build:
      context: .
      dockerfile: classification/Dockerfile
    env_file:
      - ./classification/.env
    environment:
      MODEL_DIR: /service/models
      RUNTIME_DIR: /tmp/runtime
    volumes:
      - ./classification/models:/service/models:ro
    ports:
      - "127.0.0.1:8080:8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped

  rag:
    build:
      context: ./rag
    env_file:
      - ./rag/.env
    volumes:
      - ./rag/logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
